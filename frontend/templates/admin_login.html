<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login - CropCare</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
      :root {
        --primary: #10B981;
        --primary-dark: #059669;
        --accent: #34D399;
        --bg-main: #0F172A;
        --surface: rgba(30, 41, 59, 0.85);
        --border-color: rgba(16, 185, 129, 0.25);
        --text-primary: #F8FAFC;
        --text-secondary: #94A3B8;
        --radius-lg: 24px;
        --transition-base: 250ms cubic-bezier(0.4, 0, 0.2, 1);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Inter", sans-serif;
        color: var(--text-primary);
        background:
          radial-gradient(circle at 20% 20%, rgba(16, 185, 129, 0.15) 0%, transparent 45%),
          radial-gradient(circle at 80% 80%, rgba(14, 165, 233, 0.12) 0%, transparent 45%),
          var(--bg-main);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 24px 16px;
      }

      h1, h2, h3, h4, h5, h6, .brand-font {
        font-family: "Plus Jakarta Sans", "Manrope", sans-serif;
      }

      .auth-card {
        background: var(--surface);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-radius: var(--radius-lg);
        width: 100%;
        max-width: 440px;
        padding: 40px 36px;
        box-shadow: 
          0 30px 60px -15px rgba(0, 0, 0, 0.5),
          0 0 40px -10px rgba(16, 185, 129, 0.2),
          inset 0 1px 1px 0 rgba(255, 255, 255, 0.1);
        border: 1px solid var(--border-color);
        position: relative;
        overflow: hidden;
      }

      .auth-card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 4px;
        background: linear-gradient(90deg, #10B981, #34D399, #3B82F6);
      }

      .close-btn {
        position: absolute;
        top: 20px;
        right: 20px;
        width: 38px;
        height: 38px;
        border-radius: 50%;
        background: rgba(51, 65, 85, 0.8);
        border: 1px solid rgba(148, 163, 184, 0.2);
        color: var(--text-secondary);
        font-size: 16px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: var(--transition-base);
      }

      .close-btn:hover {
        background: #334155;
        color: var(--text-primary);
        transform: rotate(90deg);
      }

      .logo-container {
        text-align: center;
        margin-bottom: 32px;
      }

      .logo-container img {
        width: 64px;
        height: 64px;
        margin: 0 auto 16px auto;
        border-radius: 16px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        border: 1px solid rgba(16, 185, 129, 0.3);
        object-fit: cover;
      }

      .logo-container h1 {
        font-size: 30px;
        font-weight: 800;
        color: var(--text-primary);
        margin-bottom: 6px;
        letter-spacing: -0.02em;
      }

      .logo-container p {
        color: #34D399;
        font-size: 14.5px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.1em;
      }

      .input-group {
        margin-bottom: 22px;
      }

      .input-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: 700;
        font-size: 0.9rem;
        color: var(--text-primary);
      }

      .input-field {
        width: 100%;
        padding: 14px 18px;
        border-radius: 14px;
        border: 1px solid rgba(148, 163, 184, 0.25);
        background: rgba(15, 23, 42, 0.6);
        color: var(--text-primary);
        font-size: 15px;
        font-weight: 500;
        transition: var(--transition-base);
      }

      .input-field::placeholder {
        color: #64748B;
        font-weight: 400;
      }

      .input-field:focus {
        outline: none;
        border-color: var(--primary);
        background: rgba(15, 23, 42, 0.9);
        box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.2);
      }

      .password-input {
        position: relative;
      }

      .password-toggle {
        position: absolute;
        right: 14px;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        color: var(--text-secondary);
        cursor: pointer;
        font-size: 16px;
        padding: 6px;
        transition: color 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .password-toggle:hover {
        color: var(--primary);
      }

      .btn {
        width: 100%;
        padding: 15px;
        border-radius: 14px;
        font-weight: 700;
        font-size: 16px;
        cursor: pointer;
        transition: var(--transition-base);
        border: none;
        position: relative;
        overflow: hidden;
      }

      .btn-primary {
        background: linear-gradient(135deg, #10B981 0%, #059669 100%);
        color: white;
        box-shadow: 0 8px 20px -4px rgba(16, 185, 129, 0.4);
      }

      .btn-primary:hover {
        background: linear-gradient(135deg, #059669 0%, #047857 100%);
        transform: translateY(-2px);
        box-shadow: 0 12px 25px -4px rgba(16, 185, 129, 0.5);
      }

      .input-error {
        border-color: #F87171 !important;
        background: rgba(239, 68, 68, 0.1) !important;
        box-shadow: 0 0 0 4px rgba(248, 113, 113, 0.2) !important;
      }

      .error-message {
        color: #F87171;
        font-size: 13px;
        font-weight: 600;
        margin-top: 7px;
        display: none;
      }

      .success-message {
        background: rgba(16, 185, 129, 0.15);
        border: 1px solid rgba(16, 185, 129, 0.3);
        border-radius: 14px;
        padding: 16px;
        margin-top: 20px;
        display: none;
        color: #34D399;
        font-weight: 700;
        font-size: 14px;
        text-align: center;
        box-shadow: 0 4px 12px rgba(16, 185, 129, 0.1);
      }

      @media (max-width: 480px) {
        .auth-card {
          padding: 30px 24px;
          border-radius: 20px;
        }
      }
    </style>
  </head>
  <body class="bg-[var(--bg-main)] text-[var(--text-primary)] font-sans antialiased">
    <div class="auth-card">
      <button class="close-btn" id="closeBtn" aria-label="Close">
        <i class="fas fa-times"></i>
      </button>

      <div class="logo-container">
        <!-- Logo Image -->
        <img
          src="static/images/logo.png"
          alt="CropCare Logo"
          onerror="
            this.style.display = 'none';
            document.querySelector('.logo-placeholder').style.display = 'block';
          "
        />
        <div class="logo-placeholder" style="display: none">
          <div class="w-16 h-16 mx-auto bg-emerald-500/10 rounded-2xl flex items-center justify-center border border-emerald-500/30 mb-4 shadow-lg">
            <svg
              class="w-10 h-10 text-emerald-400"
              fill="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                d="M12 2L13.09 8.26L20 9L13.09 9.74L12 16L10.91 9.74L4 9L10.91 8.26L12 2Z"
              />
            </svg>
          </div>
        </div>
        <h1 class="brand-font">CropCare</h1>
        <p>Admin Portal</p>
      </div>

      <form id="adminLoginForm">
        <div class="input-group">
          <label for="adminEmail">Admin Email</label>
          <input
            type="email"
            id="adminEmail"
            class="input-field"
            placeholder="Enter admin email"
            required
          />
          <div class="error-message" id="adminEmailError">
            Please enter a valid email address
          </div>
        </div>

        <div class="input-group">
          <label for="adminPassword">Password</label>
          <div class="password-input">
            <input
              type="password"
              id="adminPassword"
              class="input-field"
              placeholder="Enter admin password"
              required
            />
            <button
              type="button"
              class="password-toggle"
              id="toggleAdminPassword"
            >
              <i class="fas fa-eye"></i>
            </button>
          </div>
          <div class="error-message" id="adminPasswordError">
            Please enter your password
          </div>
        </div>

        <button type="submit" class="btn btn-primary">Login</button>

        <div class="success-message" id="successMessage">
          Admin login successful! Redirecting to dashboard...
        </div>

        <div class="error-message" id="generalError"></div>
      </form>
    </div>

    <script>
      // Close button functionality
      document
        .getElementById("closeBtn")
        .addEventListener("click", function () {
          window.location.href = "/";
        });

      // Password toggle functionality
      const toggleAdminPassword = document.getElementById(
        "toggleAdminPassword",
      );
      const adminPasswordInputField = document.getElementById("adminPassword");

      toggleAdminPassword.addEventListener("click", function () {
        const type =
          adminPasswordInputField.getAttribute("type") === "password"
            ? "text"
            : "password";
        adminPasswordInputField.setAttribute("type", type);
        this.innerHTML =
          type === "password"
            ? '<i class="fas fa-eye"></i>'
            : '<i class="fas fa-eye-slash"></i>';
      });

      // Form validation
      const adminLoginForm = document.getElementById("adminLoginForm");
      const adminEmailInput = document.getElementById("adminEmail");
      const adminPasswordInput = document.getElementById("adminPassword");
      const successMessage = document.getElementById("successMessage");
      const generalError = document.getElementById("generalError");

      // Email validation
      adminEmailInput.addEventListener("blur", function () {
        const value = this.value.trim();
        const regex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!regex.test(value)) {
          this.classList.add("input-error");
          document.getElementById("adminEmailError").style.display = "block";
        } else {
          this.classList.remove("input-error");
          document.getElementById("adminEmailError").style.display = "none";
        }
      });

      // Password validation
      adminPasswordInput.addEventListener("blur", function () {
        const value = this.value;
        if (value === "") {
          this.classList.add("input-error");
          document.getElementById("adminPasswordError").style.display = "block";
        } else {
          this.classList.remove("input-error");
          document.getElementById("adminPasswordError").style.display = "none";
        }
      });

      // Form submission
      adminLoginForm.addEventListener("submit", async function (e) {
        e.preventDefault();

        // Hide previous messages
        successMessage.style.display = "none";
        generalError.style.display = "none";

        // Validate all fields
        let isValid = true;

        // Check email
        const emailValue = adminEmailInput.value.trim();
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailValue)) {
          adminEmailInput.classList.add("input-error");
          document.getElementById("adminEmailError").style.display = "block";
          isValid = false;
        }

        // Check password
        const passwordValue = adminPasswordInput.value;
        if (passwordValue === "") {
          adminPasswordInput.classList.add("input-error");
          document.getElementById("adminPasswordError").style.display = "block";
          isValid = false;
        }

        if (isValid) {
          try {
            const formData = new FormData();
            formData.append("email", emailValue);
            formData.append("password", passwordValue);

            const response = await fetch("/auth/admin/login", {
              method: "POST",
              body: formData,
            });

            const data = await response.json();

            if (response.ok) {
              // Show success message
              successMessage.style.display = "block";

              // Redirect to admin dashboard
              setTimeout(() => {
                window.location.href = "/admin/dashboard";
              }, 1500);
            } else {
              generalError.textContent = data.detail || "Admin login failed";
              generalError.style.display = "block";
            }
          } catch (error) {
            generalError.textContent = "Network error. Please try again.";
            generalError.style.display = "block";
          }
        }
      });
    </script>
  </body>
</html>
