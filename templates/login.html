<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - CropCare</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
      :root {
        --primary: #2E7D32;
        --primary-hover: #1B5E20;
        --secondary: #43A047;
        --accent: #43A047;
        --bg-main: #F8FAF5;
        --surface: #FFFFFF;
        --border-color: #DDE5D5;
        --text-primary: #1F2937;
        --text-secondary: #6B7280;
        --dark: #FFFFFF;
        --darker: #F8FAF5;
        --light-text: #1F2937;
        --gray-text: #6B7280;
        --card-bg: #FFFFFF;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Inter", "Plus Jakarta Sans", sans-serif;
        color: var(--text-primary);
        background: linear-gradient(
          135deg,
          rgba(46, 125, 50, 0.08) 0%,
          rgba(67, 160, 71, 0.04) 50%,
          rgba(248, 250, 245, 1) 100%
        );
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      .auth-card {
        background: var(--surface);
        border-radius: 24px;
        width: 100%;
        max-width: 420px;
        padding: 36px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.06), 0 4px 12px rgba(0, 0, 0, 0.03);
        border: 1px solid var(--border-color);
        position: relative;
        overflow: hidden;
      }

      .close-btn {
        position: absolute;
        top: 20px;
        right: 20px;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: #F3F4F6;
        border: none;
        color: var(--text-secondary);
        font-size: 18px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s ease;
      }

      .close-btn:hover {
        background: #E5E7EB;
        color: var(--text-primary);
      }

      .logo-container {
        text-align: center;
        margin-bottom: 32px;
      }

      .logo-container img {
        width: 60px;
        height: 60px;
        margin-bottom: 16px;
        border-radius: 14px;
      }

      .logo-container h1 {
        font-size: 28px;
        font-weight: 800;
        color: var(--text-primary);
        margin-bottom: 6px;
        letter-spacing: -0.02em;
      }

      .logo-container p {
        color: var(--text-secondary);
        font-size: 14px;
      }

      .input-group {
        margin-bottom: 22px;
      }

      .input-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        font-size: 0.9rem;
        color: var(--text-primary);
      }

      .input-field {
        width: 100%;
        padding: 13px 16px;
        border-radius: 12px;
        border: 1px solid var(--border-color);
        background: #F8FAF5;
        color: var(--text-primary);
        font-size: 15px;
        transition: all 0.2s ease;
      }

      .input-field::placeholder {
        color: #9CA3AF;
      }

      .input-field:focus {
        outline: none;
        border-color: var(--primary);
        background: #FFFFFF;
        box-shadow: 0 0 0 3px rgba(46, 125, 50, 0.15);
      }

      .password-input {
        position: relative;
      }

      .password-toggle {
        position: absolute;
        right: 14px;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        color: var(--text-secondary);
        cursor: pointer;
        font-size: 16px;
        transition: color 0.2s;
      }

      .password-toggle:hover {
        color: var(--text-primary);
      }

      .btn {
        width: 100%;
        padding: 14px;
        border-radius: 12px;
        font-weight: 600;
        font-size: 16px;
        cursor: pointer;
        transition: all 0.3s ease;
        border: none;
        position: relative;
        overflow: hidden;
      }

      .btn-primary {
        background: var(--primary);
        color: white;
        box-shadow: 0 4px 12px rgba(46, 125, 50, 0.25);
      }

      .btn-primary:hover {
        background: var(--primary-hover);
        transform: translateY(-2px);
        box-shadow: 0 6px 16px rgba(46, 125, 50, 0.35);
      }

      .login-link {
        text-align: center;
        margin-top: 24px;
        font-size: 14px;
        color: var(--text-secondary);
      }

      .login-link a {
        color: var(--primary);
        text-decoration: none;
        font-weight: 600;
      }

      .login-link a:hover {
        text-decoration: underline;
      }

      .input-error {
        border-color: #ef5350 !important;
        background: #FEF2F2 !important;
        box-shadow: 0 0 0 3px rgba(239, 83, 80, 0.15) !important;
      }

      .error-message {
        color: #ef5350;
        font-size: 13px;
        font-weight: 500;
        margin-top: 6px;
        display: none;
      }

      .success-message {
        background: #F0FDF4;
        border: 1px solid #BBF7D0;
        border-radius: 12px;
        padding: 16px;
        margin-top: 20px;
        display: none;
        color: #166534;
        font-weight: 600;
        font-size: 14px;
        text-align: center;
      }

      .app-name-button {
        cursor: pointer;
      }

      @media (max-width: 480px) {
        .auth-card {
          padding: 24px;
          border-radius: 18px;
        }
      }
    </style>
  </head>
  <body class="bg-[var(--bg-main)] text-[var(--text-primary)] font-sans">
    <div class="auth-card">
      <button class="close-btn" id="closeBtn">
        <i class="fas fa-times"></i>
      </button>

      <div class="logo-container">
        <!-- Replace with your logo image -->
        <img
          src="static/images/logo.png"
          alt="CropCare Logo"
          onerror="
            this.style.display = 'none';
            document.querySelector('.logo-placeholder').style.display = 'block';
          "
        />
        <div class="logo-placeholder" style="display: none">
          <svg
            class="w-16 h-16 mx-auto text-green-600"
            fill="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              d="M12 2L13.09 8.26L20 9L13.09 9.74L12 16L10.91 9.74L4 9L10.91 8.26L12 2Z"
            />
          </svg>
        </div>
        <h1 class="app-name-button" id="appNameButton">CropCare</h1>
        <p>Login to your account</p>
      </div>

      <form id="loginForm">
        <div class="input-group">
          <label for="username">Email or Phone Number</label>
          <input
            type="text"
            id="username"
            class="input-field"
            placeholder="Enter your email or phone number"
            required
          />
          <div class="error-message" id="usernameError">
            Please enter a valid email or phone number
          </div>
        </div>

        <div class="input-group">
          <label for="password">Password</label>
          <div class="password-input">
            <input
              type="password"
              id="password"
              class="input-field"
              placeholder="Enter your password"
              required
            />
            <button type="button" class="password-toggle" id="togglePassword">
              <i class="fas fa-eye"></i>
            </button>
          </div>
          <div class="error-message" id="passwordError">
            Please enter your password
          </div>
        </div>

        <button type="submit" class="btn btn-primary">Login</button>

        <div class="success-message" id="successMessage">
          Login successful! Redirecting to dashboard...
        </div>

        <div class="error-message" id="errorMessage"></div>

        <div class="login-link">
          Don't have an account? <a href="/auth/register">Sign up</a>
        </div>
      </form>
    </div>

    <script>
      // Close button functionality
      document
        .getElementById("closeBtn")
        .addEventListener("click", function () {
          window.location.href = "/";
        });

      // Password toggle functionality - FIXED
      const togglePassword = document.getElementById("togglePassword");
      const passwordInputField = document.getElementById("password");

      togglePassword.addEventListener("click", function () {
        // Get current type
        const currentType = passwordInputField.getAttribute("type");

        // Toggle between password and text
        if (currentType === "password") {
          passwordInputField.setAttribute("type", "text");
          this.innerHTML = '<i class="fas fa-eye-slash"></i>';
        } else {
          passwordInputField.setAttribute("type", "password");
          this.innerHTML = '<i class="fas fa-eye"></i>';
        }
      });

      // Form validation
      const loginForm = document.getElementById("loginForm");
      const usernameInput = document.getElementById("username");
      const successMessage = document.getElementById("successMessage");
      const errorMessage = document.getElementById("errorMessage");

      // Username validation (email or phone)
      usernameInput.addEventListener("blur", function () {
        const value = this.value.trim();
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        const phoneRegex = /^[6-9]\d{9}$/;

        if (!emailRegex.test(value) && !phoneRegex.test(value)) {
          this.classList.add("input-error");
          document.getElementById("usernameError").style.display = "block";
        } else {
          this.classList.remove("input-error");
          document.getElementById("usernameError").style.display = "none";
        }
      });

      // Password validation
      passwordInputField.addEventListener("blur", function () {
        const value = this.value;
        if (value === "") {
          this.classList.add("input-error");
          document.getElementById("passwordError").style.display = "block";
        } else {
          this.classList.remove("input-error");
          document.getElementById("passwordError").style.display = "none";
        }
      });

      // Form submission
      loginForm.addEventListener("submit", async function (e) {
        e.preventDefault();

        // Hide previous messages
        successMessage.style.display = "none";
        errorMessage.style.display = "none";

        // Validate all fields
        let isValid = true;

        // Check username
        const usernameValue = usernameInput.value.trim();
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        const phoneRegex = /^[6-9]\d{9}$/;
        if (
          !emailRegex.test(usernameValue) &&
          !phoneRegex.test(usernameValue)
        ) {
          usernameInput.classList.add("input-error");
          document.getElementById("usernameError").style.display = "block";
          isValid = false;
        }

        // Check password
        const passwordValue = passwordInputField.value;
        if (passwordValue === "") {
          passwordInputField.classList.add("input-error");
          document.getElementById("passwordError").style.display = "block";
          isValid = false;
        }

        if (isValid) {
          try {
            const formData = new FormData();
            formData.append("email", usernameValue);
            formData.append("password", passwordValue);

            const response = await fetch("/auth/login", {
              method: "POST",
              body: formData,
            });

            const data = await response.json();

            if (response.ok) {
              // Show success message
              successMessage.style.display = "block";

              // Redirect based on role
              setTimeout(() => {
                if (data.role === "admin") {
                  window.location.href = "/admin/dashboard";
                } else {
                  window.location.href = "/user/dashboard";
                }
              }, 1500);
            } else {
              errorMessage.textContent = data.detail || "Login failed";
              errorMessage.style.display = "block";
            }
          } catch (error) {
            errorMessage.textContent = "Network error. Please try again.";
            errorMessage.style.display = "block";
          }
        }
      });

      // App name button - redirects to admin login
      document
        .getElementById("appNameButton")
        .addEventListener("click", function () {
          window.location.href = "/auth/admin/login";
        });
    </script>
  </body>
</html>
