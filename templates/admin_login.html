<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login - CropCare</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
      :root {
        --primary: #2E7D32;
        --primary-hover: #1B5E20;
        --secondary: #43A047;
        --accent: #43A047;
        --bg-main: #F8FAF5;
        --surface: #FFFFFF;
        --border-color: #DDE5D5;
        --text-primary: #1F2937;
        --text-secondary: #6B7280;
        --dark: #FFFFFF;
        --darker: #F8FAF5;
        --light-text: #1F2937;
        --gray-text: #6B7280;
        --card-bg: #FFFFFF;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Inter", "Plus Jakarta Sans", sans-serif;
        color: var(--text-primary);
        background: linear-gradient(
          135deg,
          rgba(46, 125, 50, 0.08) 0%,
          rgba(67, 160, 71, 0.04) 50%,
          rgba(248, 250, 245, 1) 100%
        );
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      .auth-card {
        background: var(--surface);
        border-radius: 24px;
        width: 100%;
        max-width: 420px;
        padding: 36px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.06), 0 4px 12px rgba(0, 0, 0, 0.03);
        border: 1px solid var(--border-color);
        position: relative;
        overflow: hidden;
      }

      .close-btn {
        position: absolute;
        top: 20px;
        right: 20px;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: #F3F4F6;
        border: none;
        color: var(--text-secondary);
        font-size: 18px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s ease;
      }

      .close-btn:hover {
        background: #E5E7EB;
        color: var(--text-primary);
      }

      .logo-container {
        text-align: center;
        margin-bottom: 32px;
      }

      .logo-container img {
        width: 60px;
        height: 60px;
        margin-bottom: 16px;
        border-radius: 14px;
      }

      .logo-container h1 {
        font-size: 28px;
        font-weight: 800;
        color: var(--text-primary);
        margin-bottom: 6px;
        letter-spacing: -0.02em;
      }

      .logo-container p {
        color: var(--text-secondary);
        font-size: 14px;
      }

      .input-group {
        margin-bottom: 22px;
      }

      .input-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        font-size: 0.9rem;
        color: var(--text-primary);
      }

      .input-field {
        width: 100%;
        padding: 13px 16px;
        border-radius: 12px;
        border: 1px solid var(--border-color);
        background: #F8FAF5;
        color: var(--text-primary);
        font-size: 15px;
        transition: all 0.2s ease;
      }

      .input-field::placeholder {
        color: #9CA3AF;
      }

      .input-field:focus {
        outline: none;
        border-color: var(--primary);
        background: #FFFFFF;
        box-shadow: 0 0 0 3px rgba(46, 125, 50, 0.15);
      }

      .password-input {
        position: relative;
      }

      .password-toggle {
        position: absolute;
        right: 14px;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        color: var(--text-secondary);
        cursor: pointer;
        font-size: 16px;
        transition: color 0.2s;
      }

      .password-toggle:hover {
        color: var(--text-primary);
      }

      .btn {
        width: 100%;
        padding: 14px;
        border-radius: 12px;
        font-weight: 600;
        font-size: 16px;
        cursor: pointer;
        transition: all 0.3s ease;
        border: none;
        position: relative;
        overflow: hidden;
      }

      .btn-primary {
        background: var(--primary);
        color: white;
        box-shadow: 0 4px 12px rgba(46, 125, 50, 0.25);
      }

      .btn-primary:hover {
        background: var(--primary-hover);
        transform: translateY(-2px);
        box-shadow: 0 6px 16px rgba(46, 125, 50, 0.35);
      }

      .input-error {
        border-color: #ef5350 !important;
        background: #FEF2F2 !important;
        box-shadow: 0 0 0 3px rgba(239, 83, 80, 0.15) !important;
      }

      .error-message {
        color: #ef5350;
        font-size: 13px;
        font-weight: 500;
        margin-top: 6px;
        display: none;
      }

      .success-message {
        background: #F0FDF4;
        border: 1px solid #BBF7D0;
        border-radius: 12px;
        padding: 16px;
        margin-top: 20px;
        display: none;
        color: #166534;
        font-weight: 600;
        font-size: 14px;
        text-align: center;
      }

      @media (max-width: 480px) {
        .auth-card {
          padding: 24px;
          border-radius: 18px;
        }
      }
    </style>
  </head>
  <body class="bg-[var(--bg-main)] text-[var(--text-primary)] font-sans">
    <div class="auth-card">
      <button class="close-btn" id="closeBtn">
        <i class="fas fa-times"></i>
      </button>

      <div class="logo-container">
        <!-- Replace with your logo image -->
        <img
          src="static/images/logo.png"
          alt="CropCare Logo"
          onerror="
            this.style.display = 'none';
            document.querySelector('.logo-placeholder').style.display = 'block';
          "
        />
        <div class="logo-placeholder" style="display: none">
          <svg
            class="w-16 h-16 mx-auto text-green-600"
            fill="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              d="M12 2L13.09 8.26L20 9L13.09 9.74L12 16L10.91 9.74L4 9L10.91 8.26L12 2Z"
            />
          </svg>
        </div>
        <h1>CropCare</h1>
        <p>Admin Portal</p>
      </div>

      <form id="adminLoginForm">
        <div class="input-group">
          <label for="adminEmail">Admin Email</label>
          <input
            type="email"
            id="adminEmail"
            class="input-field"
            placeholder="Enter admin email"
            required
          />
          <div class="error-message" id="adminEmailError">
            Please enter a valid email address
          </div>
        </div>

        <div class="input-group">
          <label for="adminPassword">Password</label>
          <div class="password-input">
            <input
              type="password"
              id="adminPassword"
              class="input-field"
              placeholder="Enter admin password"
              required
            />
            <button
              type="button"
              class="password-toggle"
              id="toggleAdminPassword"
            >
              <i class="fas fa-eye"></i>
            </button>
          </div>
          <div class="error-message" id="adminPasswordError">
            Please enter your password
          </div>
        </div>

        <button type="submit" class="btn btn-primary">Login</button>

        <div class="success-message" id="successMessage">
          Admin login successful! Redirecting to dashboard...
        </div>

        <div class="error-message" id="generalError"></div>
      </form>
    </div>

    <script>
      // Close button functionality
      document
        .getElementById("closeBtn")
        .addEventListener("click", function () {
          window.location.href = "/";
        });

      // Password toggle functionality
      const toggleAdminPassword = document.getElementById(
        "toggleAdminPassword",
      );
      const adminPasswordInputField = document.getElementById("adminPassword");

      toggleAdminPassword.addEventListener("click", function () {
        const type =
          adminPasswordInputField.getAttribute("type") === "password"
            ? "text"
            : "password";
        adminPasswordInputField.setAttribute("type", type);
        this.innerHTML =
          type === "password"
            ? '<i class="fas fa-eye"></i>'
            : '<i class="fas fa-eye-slash"></i>';
      });

      // Form validation
      const adminLoginForm = document.getElementById("adminLoginForm");
      const adminEmailInput = document.getElementById("adminEmail");
      const adminPasswordInput = document.getElementById("adminPassword");
      const successMessage = document.getElementById("successMessage");
      const generalError = document.getElementById("generalError");

      // Email validation
      adminEmailInput.addEventListener("blur", function () {
        const value = this.value.trim();
        const regex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!regex.test(value)) {
          this.classList.add("input-error");
          document.getElementById("adminEmailError").style.display = "block";
        } else {
          this.classList.remove("input-error");
          document.getElementById("adminEmailError").style.display = "none";
        }
      });

      // Password validation
      adminPasswordInput.addEventListener("blur", function () {
        const value = this.value;
        if (value === "") {
          this.classList.add("input-error");
          document.getElementById("adminPasswordError").style.display = "block";
        } else {
          this.classList.remove("input-error");
          document.getElementById("adminPasswordError").style.display = "none";
        }
      });

      // Form submission
      adminLoginForm.addEventListener("submit", async function (e) {
        e.preventDefault();

        // Hide previous messages
        successMessage.style.display = "none";
        generalError.style.display = "none";

        // Validate all fields
        let isValid = true;

        // Check email
        const emailValue = adminEmailInput.value.trim();
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailValue)) {
          adminEmailInput.classList.add("input-error");
          document.getElementById("adminEmailError").style.display = "block";
          isValid = false;
        }

        // Check password
        const passwordValue = adminPasswordInput.value;
        if (passwordValue === "") {
          adminPasswordInput.classList.add("input-error");
          document.getElementById("adminPasswordError").style.display = "block";
          isValid = false;
        }

        if (isValid) {
          try {
            const formData = new FormData();
            formData.append("email", emailValue);
            formData.append("password", passwordValue);

            const response = await fetch("/auth/admin/login", {
              method: "POST",
              body: formData,
            });

            const data = await response.json();

            if (response.ok) {
              // Show success message
              successMessage.style.display = "block";

              // Redirect to admin dashboard
              setTimeout(() => {
                window.location.href = "/admin/dashboard";
              }, 1500);
            } else {
              generalError.textContent = data.detail || "Admin login failed";
              generalError.style.display = "block";
            }
          } catch (error) {
            generalError.textContent = "Network error. Please try again.";
            generalError.style.display = "block";
          }
        }
      });
    </script>
  </body>
</html>
